# Small independent API/UI regression target; no main data or benchmark data.
services:
  migrate-seed:
    image: eczanet-a6-app:local
    environment:
      DEMO_FULL_SEED: "false"
  api:
    image: eczanet-a6-app:local
    environment:
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080,http://localhost:13006,http://localhost:18086,http://localhost:13007,http://localhost:18087
    container_name: ddo-orman-api-a6-ui
    ports: !override ["18087:8080"]
  web:
    image: eczanet-a6-web:local
    ports: !override ["13007:3000"]
  simulator:
    image: eczanet-a6-app:local
    environment:
      SIMULATOR_ENABLED: "false"
  verify:
    image: eczanet-a6-app:local
  tools:
    image: eczanet-a6-tools:local
