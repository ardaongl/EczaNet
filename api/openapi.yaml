components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: eczanet_session
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
      example: http://localhost:8080
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    CSRF:
      type: object
      required:
      - csrf_token
      properties:
        csrf_token:
          type: string
    User:
      type: object
      required:
      - id
      - email
      - role
      properties:
        id:
          type: string
          description: bigint kimlik metin olarak tasinir
        email:
          type: string
        role:
          type: string
          enum:
          - pharmacist
          - technician
          - warehouse
          - manager
          - accountant
          - simulator
    Location:
      type: object
      required:
      - id
      - name
      - kind
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - branch
          - warehouse
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
        new_quote:
          $ref: '#/components/schemas/Quote'
    Item:
      type: object
      additionalProperties: false
      properties:
        product_id: *id002
        quantity: *id002
        unit:
          type: string
          enum:
          - unit
          - pack
          - blister
      required:
      - product_id
      - quantity
      - unit
    ReceiptLine:
      type: object
      additionalProperties: false
      properties:
        product_id: *id002
        quantity: *id002
        lot:
          type: string
          maxLength: 100
        expires_on:
          type: string
          format: date
      required:
      - product_id
      - quantity
      - lot
      - expires_on
    ProductInput:
      type: object
      additionalProperties: false
      properties:
        barcode: &id009
          type: string
          pattern: ^[0-9]{4,40}$
        name: &id010
          type: string
        dose: &id011
          type: string
        form: &id012
          type: string
        base_unit: &id013
          type: string
          enum:
          - tablet
          - ml
          - adet
        pack_size: &id014
          type: string
        blister_size: &id015
          type: string
        sale_multiple: &id016
          type: string
        controlled_group: &id017
          type: string
        pack_price: &id018
          type: string
        ingredients: &id019
          type: array
          minItems: 1
          items: *id001
        prescription_required: &id020
          type: boolean
      required:
      - barcode
      - name
      - dose
      - form
      - base_unit
      - pack_size
      - blister_size
      - sale_multiple
      - ingredients
    Product:
      type: object
      additionalProperties: false
      properties:
        barcode: *id009
        name: *id010
        dose: *id011
        form: *id012
        base_unit: *id013
        pack_size: *id014
        blister_size: *id015
        sale_multiple: *id016
        controlled_group: *id017
        pack_price: *id018
        ingredients: *id019
        prescription_required: *id020
        id: *id002
        active:
          type: boolean
      required:
      - id
      - barcode
      - name
      - dose
      - form
      - base_unit
      - pack_size
      - blister_size
      - sale_multiple
      - ingredients
      - active
    LocationCommand:
      type: object
      additionalProperties: false
      properties:
        location_id: *id002
      required:
      - location_id
    CreateProduct:
      type: object
      additionalProperties: false
      properties:
        location_id: *id002
        product:
          $ref: '#/components/schemas/ProductInput'
      required:
      - location_id
      - product
    CreateReceipt:
      type: object
      additionalProperties: false
      properties:
        location_id: *id002
        supplier_id: *id002
        document_no:
          type: string
          maxLength: 100
        reason:
          type: string
          maxLength: 500
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReceiptLine'
        order_id: *id007
        receipt_mode:
          type: string
          enum:
          - quarantine
      required:
      - location_id
      - supplier_id
      - document_no
      - reason
      - lines
    CreateTransfer:
      type: object
      additionalProperties: false
      properties:
        location_id: *id002
        target_id: *id002
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Item'
        allocation_id: *id007
      required:
      - location_id
      - target_id
      - items
    QuoteInput:
      type: object
      additionalProperties: false
      properties:
        location_id: *id002
        items: &id022
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Item'
        prescription_id: *id021
        dispense:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DispenseItem'
      required:
      - location_id
      oneOf:
      - required:
        - items
        not:
          anyOf:
          - required:
            - prescription_id
          - required:
            - dispense
      - required:
        - prescription_id
        - dispense
        not:
          required:
          - items
      description: Normal sale uses items. RX sale uses prescription_id + dispense.
        dispensed_product_id differs from prescribed_product_id on RX line. Totals/effective_at
        from client are rejected.
    CreateSale:
      type: object
      additionalProperties: false
      properties:
        location_id: *id002
        items: *id022
        quote: *id001
        prescription_id: *id021
        dispense:
          type: array
          minItems: 1
          maxItems: 100
