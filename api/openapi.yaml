          - cash
          - card
          default: cash
          description: Demo collection label only; no payment integration
      required:
      - location_id
      - quote
      oneOf:
      - required:
        - items
        not:
          anyOf:
          - required:
            - prescription_id
          - required:
            - dispense
      - required:
        - prescription_id
        - dispense
        not:
          required:
          - items
      description: Normal sale uses items. RX sale uses prescription_id + dispense.
        dispensed_product_id differs from prescribed_product_id on RX line. Totals/effective_at
        from client are rejected.
