      description: Sales lock each product FOR SHARE, ordered by numeric product id,
        before stock guards/effective_at/pricing; publication holds FOR UPDATE until
        commit. valid_from is checked against the real DB clock AFTER the exclusive
        product lock. If the requested start passed while waiting, reject atomically
        with 422 FUTURE_PRICE_REQUIRED; do not backdate or shift the start automatically.
        If a publisher acquired the lock before its future start, commit may be delayed
        past that start while sales remain blocked; those sales price only after publication
        commit.
