openapi: 3.0.3
info:
  title: EczaNet A6
  version: 0.6.0
  description: |
    Kurgusal A1-A6 demo; gercek SGK/MEDULA veya odeme entegrasyonu yoktur.
    Her API yaniti X-DDO-Stamp a33906 ve X-Request-ID tasir; hatalar error/code/message bicimindedir.
    Login/logout ve is POST uclari izinli Origin ve CSRF ister. Oturum8 saat, prelogin10 dakika.
    Cookie HttpOnly/SameSite=Lax; TLS modunda Secure. Kimliksiz401, yasak403, durum409, kural422, gecici503.
    Kritik POST Idempotency-Key kapsaminda normalize body ile tek etki; replay oncesi yetki yeniden kontrol edilir.
    Bigint kimlik/miktar/kurus JSON metni; keyset sayfa50/max200, degisen scope cursor400.
    Bilinmeyen JSON alanlari reddedilir; govde16KiB; lock2s/statement5s/HTTP15s/proxy20s.
    Katalog/FEFO/recete/fiyat/iade/karantina/transfer/sayim/tedarik/oneri/rapor ve gercek dashboard mevcuttur.
    Bes insan rolu, ek B subesi ve sadece acik atanmis lokasyonlarda sinirli simulator servis hesabi vardir.
    Simulator HTTP API kullanir; runtime saat override veya offline seed yazma yetkisi yoktur.

servers:
- url: http://localhost:8080
- url: http://localhost:3000
security:
- session: []
paths:
  /api/v1/dashboard:
    get:
      summary: Caller-scoped live sales and stock summary; simulator offline/stopped/running status
      responses:
        '200':
          description: Real aggregates and last authorized simulator event; refresh every 5 seconds
          content:
            application/json:
              schema:
                type: object
                required: [sale_count, physical, simulator, updated_at]
                properties:
                  sale_count: {type: string}
                  physical: {type: string}
                  simulator: {type: object, additionalProperties: true}
                  updated_at: {type: string, format: date-time}
        '401': {description: Session required}
        '403': {description: Service account cannot use interactive summary}
        '503': {description: Database unavailable}
  /health:
    get:
      security: []
      summary: Bir saniye butceli DB readiness
      responses:
        '200':
          description: DB erisilebilir
        '503':
          $ref: '#/components/responses/Unavailable'
  /_hz/a339:
    get:
      security: []
      summary: DB'den bagimsiz liveness
      responses:
        '200':
          description: API ayakta
  /metrics:
    get:
      security: []
      summary: Lokal demoda acik, yalniz teknik metrikler
      responses:
        '200':
          description: Prometheus exposition
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth/csrf:
    get:
      security: []
      summary: Cookie jar'a prelogin cookie ve JSON token al; login sonrasi oturum
        CSRF'sini al
      description: 'Giris oncesi 32 byte rastgele token uretilir; yalniz hash''i ve
        bitis zamani

        sunucunun sinirli belleginde tutulur. Istemci JSON tokenini header''a koyar;

        HttpOnly cookie tarayici tarafindan aynen iletilir. Yeniden baslatma eski

        prelogin tokenini gecersiz kilar; endpointi yeniden cagir. Giris sonrasi

        bu endpoint mevcut oturuma bagli tokeni dondurur, yeni oturum acmaz.

        '
      responses:
        '200':
          description: Set-Cookie ve CSRF JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRF'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/login:
    post:
      security: []
      summary: Five human roles plus branch B and restricted simulator service login
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  maxLength: 72
      responses:
        '200':
          description: Yeni session cookie; eski tarayici oturumu iptal edilir
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                - csrf_token
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  csrf_token:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/logout:
    post:
      summary: Oturumu DB'de iptal et ve cookie'yi temizle
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Bos govde; session cookie temizlenir
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
